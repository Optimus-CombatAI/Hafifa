[project]
name = "air-quality-api"
version = "0.1.0"
description = "API for uploading city air quality measurements and querying their AQI and alerts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order
select = ["E", "W", "F", "I"]
